name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build iOS target without signing
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project RawLiDAR.xcodeproj -scheme RawLiDAR -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/RawLiDAR-build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Test production metadata, recording deletion, compression, and ZIP export
        run: |
          swiftc RawLiDAR/CaptureFormat.swift RawLiDAR/BufferCompression.swift RawLiDAR/ArchiveExporter.swift \
            RawLiDAR/RecordingInfo.swift RawLiDAR/RecordingLibrary.swift \
            tests/swift/main.swift -o "$RUNNER_TEMP/export-tests"
          "$RUNNER_TEMP/export-tests"
